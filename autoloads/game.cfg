; ---------------------------------------------------------------------------
; game.cfg — метаданные сборки и режим проверки (dev/harness).
; Синтаксис: `;` или `#` — комментарий, значения парсятся как литералы Godot.
; Порядок слияния: res://autoloads -> res://override_cfg -> user://override_cfg.
; ---------------------------------------------------------------------------

[game]
; Версия печатается в главном меню («ВЕРСИЯ: …») — см. также ui.cfg.
version = "4.0.9 TEXT"
build_name = "4.0.9"
; Пакет Android (созвучен с export_presets.cfg: com.racing.chase).
package_name = "com.racing.chase"
project_title = "Police Chase: Open World"
; Куда DebugConsole пишет текстовый отчёт (пусто — не писать).
; CI задаёт его переменной GODOT_REPORT_PATH, см. .github/workflows/ci.yml.
report_path = "res://ci-reports/runtime-report.txt"

[dev]
; Автотест-харнесс: сколько секунд симуляции прогонять в headless-режиме.
harness_seconds = 8.0
; Кадр, на котором харнесс делает первый скриншот (0 = сразу после загрузки).
harness_warmup_frames = 30
; Куда писать скриншоты (res:// = попадут в git-отчёт CI, user:// = только локально).
harness_screenshot_dir = "res://ci-reports/screenshots"
; Симулировать нажатие газа, когда игрок не вводил управление.
harness_auto_drive = true
; Печатать telemetry.json (состояние машины/полиции по кадрам) в stdout.
harness_dump_telemetry = true
; Максимум строк, который держит DebugConsole.
log_capacity = 600

; ---------------------------------------------------------------------------
; world.cfg — размер мира, сеть дорог, плотность застройки, LOD/стриминг.
; Секция [world] загружается в res://scripts/config/world_config.gd.
; Любое число можно переопределить в res://override_cfg/world.cfg или user://override_cfg/world.cfg
; (CI-харнесс делает именно так, чтобы гонять быстрый «маленький мир»).
; ---------------------------------------------------------------------------

[world]
seed = 20260923
chunk_size_m = 200.0
load_radius_chunks = 1
unload_margin_chunks = 0.6
max_active_chunks = 12
chunk_build_budget_ms = 5.5

; Бетон на 500 метров во все стороны от точки спавна + видимая сетка швов плит.
world_radius_m = 500.0
concrete_slab_m = 6.0
concrete_color = Color(0.60, 0.60, 0.585, 1.0)
concrete_joint_color = Color(0.44, 0.45, 0.45, 1.0)
concrete_slab_tint_variance = 0.045
asphalt_color = Color(0.145, 0.148, 0.155, 1.0)
sidewalk_color = Color(0.52, 0.52, 0.51, 1.0)
ground_grain = 0.14
ground_y_m = 0.0
spawn_height_m = 0.62

; Прямоугольная решётка дорог: каждые `avenue_every` линий — широкий проспект.
block_pitch_m = 82.0
road_width_m = 15.0
avenue_width_m = 21.0
avenue_every = 3
sidewalk_width_m = 4.5
curb_height_m = 0.15
road_markings = true
dash_length_m = 3.0
dash_gap_m = 5.0
parking_bay_m = 2.6

; Здания: составные модели (цоколь, этажи, карниз, балкон, кровля с инженеркой).
building_density = 0.86
max_buildings_per_block = 4
min_floors = 2
max_floors = 17
floor_height_m = 3.25
office_share = 0.34
brick_share = 0.30
industrial_share = 0.14
balcony_share = 0.45
rooftop_props_share = 0.75
shopfront_share = 0.62
lot_inset_m = 3.0
detailed_floors_max = 12

; Мелочи, которые и делают мир «плотным»: фонари, деревья, урны, конусы, припаркованные авто.
street_lamps_per_chunk = 26
trees_per_chunk = 22
bins_per_chunk = 12
cones_per_chunk = 14
barriers_per_chunk = 7
dumpsters_per_chunk = 6
traffic_lights_per_chunk = 8
parked_cars_per_chunk = 34
props_for_small_buildings = 0.6

; Плавный переход «рядом детально — далеко пусто»: LOD + кольцо силуэта + туман.
detail_distance_m = 165.0
lod1_distance_m = 300.0
lod2_distance_m = 560.0
cull_distance_m = 900.0
skyline_ring_start_m = 640.0
skyline_ring_end_m = 2200.0
skyline_instances = 300
fog_density = 0.0016
fog_color = Color(0.66, 0.72, 0.80, 1.0)

; Окклюдеры (дешёвый BVH по коробкам зданий) и дорожный граф для ИИ/навигации.
build_occluders = true
occluder_min_height_m = 11.0
occluders_per_chunk_max = 28
nav_node_spacing_m = 18.0
nav_snap_tolerance_m = 26.0

topdown_shot_height_m = 780.0

; ---------------------------------------------------------------------------
; graphics.cfg — политика качества + три пресета.
; Всё дорогое для мобильной GPU (тени, масштаб рендера, дальность, плотность
; реквизита) живёт в пресетах, чтобы менять «качество» одним числом.
; heavy real-time effects (SSR, volumetric, тяжёлый GI) здесь просто не включены.
; ---------------------------------------------------------------------------

[graphics]
auto_tier = true
forced_tier = -1
fps_target = 60.0
downgrade_fps = 42.0
upgrade_fps = 57.0
check_window_s = 3.0
confirmations = 2
low_battery_safe_mode = true
vsync = true
initial_tier_for_low_ram = 0
section_for_tier_0 = "graphics.tier_low"
section_for_tier_1 = "graphics.tier_medium"
section_for_tier_2 = "graphics.tier_high"

[graphics.tier_low]
display_name = "low"
shadows_enabled = false
shadow_atlas_size = 512
shadow_distance_m = 45.0
shadow_bias = 0.08
rendering_scale = 0.8
msaa_3d = 0
occlusion_culling = true
lod_bias = 0.72
prop_density = 0.45
cull_distance_multiplier = 0.7
fog_density_multiplier = 1.45
glow_enabled = false
glow_intensity = 0.0
half_res_effects = true
anisotropy = 0
texture_filter = 1
sky_realtime_update = false
max_chunks = 6

[graphics.tier_medium]
display_name = "medium"
shadows_enabled = true
shadow_atlas_size = 1024
shadow_distance_m = 110.0
shadow_bias = 0.05
rendering_scale = 1.0
msaa_3d = 0
occlusion_culling = true
lod_bias = 1.0
prop_density = 1.0
cull_distance_multiplier = 1.0
fog_density_multiplier = 1.0
glow_enabled = false
glow_intensity = 0.25
half_res_effects = false
anisotropy = 0
texture_filter = 1
sky_realtime_update = false
max_chunks = 9

[graphics.tier_high]
display_name = "high"
shadows_enabled = true
shadow_atlas_size = 2048
shadow_distance_m = 160.0
shadow_bias = 0.04
rendering_scale = 1.0
msaa_3d = 1
occlusion_culling = true
lod_bias = 1.35
prop_density = 1.5
cull_distance_multiplier = 1.4
fog_density_multiplier = 0.85
glow_enabled = true
glow_intensity = 0.4
half_res_effects = false
anisotropy = 2
texture_filter = 1
sky_realtime_update = true
max_chunks = 16

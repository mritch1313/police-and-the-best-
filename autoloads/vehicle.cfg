; ---------------------------------------------------------------------------
; vehicle.cfg — физика машин. Секции [vehicle.player] и [vehicle.police]
; грузятся в один и тот же класс res://scripts/config/vehicle_config.gd,
; поэтому поведение патруля настраивается теми же ключами, что и игрока.
;
; Баланс зафиксирован в res://scripts/core/balance_rules.gd:
;   police_max = player_max * 1.01,  player_max * nitro = police_max * 1.25
; Здесь: 165 -> 168.03 ~ 168, 165*1.273 = 210.0 ~ 168*1.25 = 210.0
; ---------------------------------------------------------------------------


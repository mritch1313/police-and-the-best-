; ---------------------------------------------------------------------------
; nitro.cfg — нитро игрока. Никакой магии: система меняет доступную тягу и
; доступный предел скорости, машину двигает физика Godot.
;   max_speed_multiplier: 165 * 1.273 = 210.0 км/ч == police_max(168.03) * 1.25
; ---------------------------------------------------------------------------

[nitro]
enabled = true
max_charge = 100.0
drain_per_s = 26.0
regen_per_s = 11.5
regen_delay_s = 0.85
min_to_start = 12.0
min_sustained = 6.0
; Ограничение по времени удержания: дольше 4.2 с буст блокируется до охлаждения.
max_burst_s = 4.2
overheat_cooldown_s = 1.6
max_speed_multiplier = 1.273
thrust_multiplier = 1.62
grip_multiplier = 1.04
drag_multiplier = 1.18
exhaust_flames = true
boost_fov_add = 7.5
presentation_smoothing = 1.4

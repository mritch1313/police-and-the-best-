name: Environment Probe

# Manual only: the regular pipeline lives in ci.yml (validate -> test -> Android APK).
# This probe is kept as the diagnostic tool for "what can a fresh runner actually do".
on:
  workflow_dispatch:

permissions:
  contents: write

# GitHub's raw job logs are unreachable from some environments, so this probe writes a
# report into ci-reports/<job>-latest.txt and commits it back to the branch with
# "[skip ci]". The report is the authoritative log of what the runner really did.
jobs:
  probe:
    name: Runner capability probe (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Runner facts
        run: |
          set -x
          REPORT=/tmp/report.txt
          {
            echo "=== RUNNER FACTS ==="
            uname -a
            echo "nproc: $(nproc)"
            free -h
            df -h /
            echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
            echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME:-unset}"
            java -version 2>&1
            echo "JAVA_HOME=${JAVA_HOME:-unset}"
            echo "--- sdk root ---"
            ls -la /usr/local/lib/android/sdk 2>/dev/null || echo "no sdk"
            echo "--- build-tools ---"
            ls -la /usr/local/lib/android/sdk/build-tools 2>/dev/null || true
            echo "--- platforms ---"
            ls -la /usr/local/lib/android/sdk/platforms 2>/dev/null || true
            echo "--- jvm ---"
            ls -la /usr/lib/jvm 2>/dev/null || true
            echo "--- tools ---"
            which sdkmanager adb apksigner zipalign gradle xvfb-run 2>&1 || true
          } | tee "$REPORT"
          cp "$REPORT" /tmp/runner_facts.txt

      - name: Setup Godot
        uses: ./.github/actions/setup-godot
        with:
          godot-version: "4.7.2"
          export-templates: "true"

      - name: Godot version + import + headless run
        run: |
          set -x
          {
            echo
            echo "=== GODOT ==="
            godot --version 2>&1
            echo "--- export templates ---"
            ls -la "$HOME/.local/share/godot/export_templates/4.7.2.stable" 2>&1 | head -24
            echo "--- import ---"
            godot --headless --import --path . 2>&1 | tail -25
            echo "--- headless run of the main scene ---"
            timeout 180 godot --headless --path . --quit-after 600 2>&1 | tail -25
          } | tee -a /tmp/runner_facts.txt

      - name: Xvfb + software OpenGL render probe
        run: |
          set -x
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri || true
          {
            echo
            echo "=== XVFB / SOFTWARE OPENGL ==="
            xvfb-run -a glxinfo -B 2>&1 | head -14 || echo "(glxinfo unavailable)"
            echo "--- godot on xvfb ---"
            timeout 240 xvfb-run -a -s "-screen 0 1280x720x24" godot --rendering-driver opengl3 --path . --quit-after 600 2>&1 | tail -30 || echo "xvfb run exit=$?"
          } | tee -a /tmp/runner_facts.txt

      - name: Editor settings + android export attempt
        run: |
          set +e
          {
            echo
            echo "=== ANDROID EXPORT ATTEMPT ==="
          } >> /tmp/runner_facts.txt
          mkdir -p "$HOME/.config/godot" "$HOME/.android" build/android
          timeout 240 godot --headless --editor --quit --path . > /tmp/editor.log 2>&1
          echo "editor exit=$?" >> /tmp/runner_facts.txt
          tail -10 /tmp/editor.log >> /tmp/runner_facts.txt
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          JDK="$(dirname "$(dirname "$(readlink -f "$(which javac)")")")"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" > /tmp/keytool.log 2>&1
          SETTINGS="$HOME/.config/godot/editor_settings-4.tres"
          if [ ! -f "$SETTINGS" ]; then
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n' > "$SETTINGS"
          fi
          {
            echo "export/android/android_sdk_path = \"$SDK\""
            echo "export/android/java_sdk_path = \"$JDK\""
            echo "export/android/debug_keystore = \"$HOME/.android/debug.keystore\""
            echo "export/android/debug_keystore_user = \"androiddebugkey\""
            echo "export/android/debug_keystore_pass = \"android\""
            echo "export/android/force_system_user = false"
          } >> "$SETTINGS"
          export ANDROID_HOME="$SDK"
          export JAVA_HOME="$JDK"
          timeout 1200 godot --headless --export-release "Android" "build/android/probe.apk" --path . > /tmp/export.log 2>&1
          EXPORT_EXIT=$?
          echo "EXPORT EXIT=$EXPORT_EXIT" >> /tmp/runner_facts.txt
          {
            echo "SDK=$SDK JDK=$JDK"
            echo "--- editor settings file ---"
            cat "$SETTINGS" | tail -20
            echo "--- export log (full) ---"
            cat /tmp/export.log
            echo "--- build/android ---"
            ls -la build/android
            echo "--- editor log tail ---"
            tail -20 /tmp/editor.log
          } >> /tmp/runner_facts.txt
          if [ "$EXPORT_EXIT" -ne 0 ]; then
            echo "::error title=Android export failed::godot --export-release returned $EXPORT_EXIT (see ci-reports/probe-latest.txt)"
          else
            echo "::notice title=Android export OK::APK written to build/android/probe.apk"
          fi
          exit 0

      - name: Publish report into the repository
        if: always()
        run: |
          chmod +x tools/ci/publish_report.sh
          bash tools/ci/publish_report.sh probe /tmp/runner_facts.txt

      - name: Upload probe apk (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-apk
          path: build/android/*.apk
          if-no-files-found: ignore
